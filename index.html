<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camila & Mateo · Nuestra boda</title>

<meta name="description" content="Una historia de amor que queremos celebrar junto a vos.">

<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f7f3ec;
    color:#40372f;
    line-height:1.6;
}

section{
    padding:70px 20px;
}

.container{
    max-width:680px;
    margin:auto;
}

h1,h2,h3{
    font-family:Georgia, "Times New Roman", serif;
    font-weight:normal;
}

h2{
    font-size:30px;
    text-align:center;
    margin-bottom:25px;
    letter-spacing:.5px;
}

p{
    font-size:15px;
}


/* =========================
   SOBRE / PORTADA
========================= */

.cover{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:#f7f3ec;
    padding:30px 20px;
    overflow:hidden;
}

.envelope-wrapper{
    width:100%;
    max-width:430px;
}

.envelope{
    position:relative;
    width:100%;
    max-width:360px;
    height:250px;
    margin:0 auto 35px;
    perspective:1000px;
}

.envelope-back{
    position:absolute;
    inset:0;
    background:#e8ded0;
    border:1px solid #c8b99f;
    box-shadow:0 12px 35px rgba(64,55,47,.12);
}

.envelope-front{
    position:absolute;
    inset:0;
    background:#eee5d9;
    border:1px solid #c8b99f;
    z-index:3;
    clip-path:polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
}

.envelope-flap{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:58%;
    background:#e2d5c5;
    border:1px solid #c8b99f;
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    z-index:5;
    transition:transform 1.2s ease;
}

.envelope-content{
    position:absolute;
    inset:0;
    z-index:2;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.envelope-small{
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.envelope-names{
    font-family:Georgia, "Times New Roman", serif;
    font-size:31px;
    font-style:italic;
}

.envelope-date{
    font-size:11px;
    letter-spacing:2px;
    margin-top:12px;
}

.cover-text{
    opacity:1;
    transition:opacity .5s ease;
}

.cover-small{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.cover-title{
    font-family:Georgia, "Times New Roman", serif;
    font-size:20px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:25px;
}

.open-btn{
    display:inline-block;
    padding:13px 30px;
    border:1px solid #9b8b7b;
    color:#40372f;
    text-decoration:none;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    background:transparent;
    cursor:pointer;
    transition:.3s;
}

.open-btn:hover{
    background:#40372f;
    color:#fff;
}


/* =========================
   SOBRE ABIERTO
========================= */

.cover.opened .envelope-flap{
    transform:rotateX(180deg);
}

.cover.opened .cover-text{
    opacity:0;
    pointer-events:none;
}

.cover.opened .envelope{
    transform:translateY(-5px);
    transition:transform .8s ease;
}


/* =========================
   BIENVENIDA
========================= */

.welcome{
    text-align:center;
    background:#f7f3ec;
}

.welcome p{
    max-width:540px;
    margin:0 auto;
}

.decor-line{
    width:50px;
    height:1px;
    background:#a89a8a;
    margin:20px auto;
}


/* =========================
   NOMBRES
========================= */

.names-section{
    text-align:center;
    background:#eee5d9;
}

.names{
    font-family:Georgia, "Times New Roman", serif;
    font-size:42px;
    font-style:italic;
    line-height:1.3;
}

.and{
    font-size:20px;
    margin:8px 0;
    color:#a89a8a;
}


/* =========================
   CUENTA REGRESIVA
========================= */

.countdown-section{
    text-align:center;
    background:#f7f3ec;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:30px;
}

.time-box{
    width:75px;
}

.time-number{
    font-family:Georgia, "Times New Roman", serif;
    font-size:30px;
}

.time-label{
    font-size:9px;
    letter-spacing:1px;
    text-transform:uppercase;
}


/* =========================
   EVENTO
========================= */

.event{
    text-align:center;
    background:#eee5d9;
}

.event-card{
    max-width:500px;
    margin:auto;
    padding:30px 20px;
    border-top:1px solid #c8b99f;
    border-bottom:1px solid #c8b99f;
}

.event-title{
    font-family:Georgia, "Times New Roman", serif;
    font-size:23px;
    margin-bottom:8px;
}

.event-address{
    margin-bottom:25px;
    font-size:14px;
}

.location-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.location-btn{
    display:inline-block;
    padding:10px 18px;
    border:1px solid #9b8b7b;
    color:#40372f;
    text-decoration:none;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
}


/* =========================
   RSVP
========================= */

.rsvp{
    text-align:center;
    background:#f7f3ec;
}

.rsvp-btn{
    display:inline-block;
    margin-top:20px;
    padding:13px 28px;
    background:#40372f;
    color:white;
    text-decoration:none;
    font-size:11px;
    letter-spacing:1px;
}


/* =========================
   DRESS CODE
========================= */

.dresscode{
    text-align:center;
    background:#eee5d9;
}

.dresscode-main{
    font-family:Georgia, "Times New Roman", serif;
    font-size:24px;
    font-style:italic;
    margin-bottom:10px;
}


/* =========================
   REGALO
========================= */

.gift{
    text-align:center;
    background:#f7f3ec;
}

.gift-box{
    max-width:500px;
    margin:25px auto 0;
    padding:30px 20px;
    border:1px solid #d2c5b7;
}

.data{
    margin:18px 0;
}

.data-label{
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:5px;
}

.data-value{
    font-size:16px;
    word-break:break-word;
}

.copy-btn{
    margin-top:8px;
    padding:7px 15px;
    background:transparent;
    border:1px solid #9b8b7b;
    color:#40372f;
    cursor:pointer;
    font-size:10px;
}


/* =========================
   GALERÍA
========================= */

.gallery{
    background:#eee5d9;
}

.photos{
    width:100%;
    max-width:500px;
    margin:35px auto 0;

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.gallery img{
    width:100%;
    height:240px;
    object-fit:cover;
    display:block;
    filter:saturate(.75);
    transition:transform .4s ease;
}

.gallery img:hover{
    transform:scale(1.02);
}


/* =========================
   WHATSAPP
========================= */

.contact{
    text-align:center;
    background:#f7f3ec;
}

.whatsapp-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    border:1px solid #9b8b7b;
    color:#40372f;
    text-decoration:none;
    font-size:11px;
    letter-spacing:1px;
}


/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:50px 20px;
    background:#40372f;
    color:#f7f3ec;
}

.footer-brand{
    font-size:17px;
    margin-bottom:8px;
}

.footer-instagram{
    font-size:12px;
    margin-bottom:15px;
}

.footer-phrase{
    font-family:Georgia, "Times New Roman", serif;
    font-size:12px;
    font-style:italic;
    opacity:.85;
}


/* =========================
   MÚSICA
========================= */

.music-btn{
    position:fixed;
    right:18px;
    bottom:18px;
    width:45px;
    height:45px;
    border-radius:50%;
    border:1px solid #806f61;
    background:#f7f3ec;
    color:#40372f;
    font-size:18px;
    cursor:pointer;
    z-index:999;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    section{
        padding:55px 18px;
    }

    .envelope{
        max-width:320px;
        height:220px;
    }

    .envelope-names{
        font-size:27px;
    }

    .names{
        font-size:35px;
    }

    .countdown{
        gap:7px;
    }

    .time-box{
        width:65px;
    }

    .time-number{
        font-size:25px;
    }

    .photos{
        max-width:360px;
        gap:8px;
    }

    .gallery img{
        height:auto;
        aspect-ratio:1 / 1;
    }

}

</style>

</head>


<body>

     PORTADA / SOBRE
========================= -->
